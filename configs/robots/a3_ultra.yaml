# ---------------------------------------------------------------------
# Control subsets (project convention, not hardware):
#   control_joints  : joints the locomotion policy commands.
#   observation_joints: joints included in proprioceptive obs.
# First baseline follows upstream practice (whole-body position targets
# for legs+waist+arms; head frozen at default).
# ---------------------------------------------------------------------
control:
  control_joints_mode: legs_waist_arms   # excludes head_yaw/head_pitch
  frozen_joints: [head_yaw_joint, head_pitch_joint]
  policy_frequency_hz: 50                # assumed (project choice; AgiBot X1 stack used 100 Hz)
  # These two describe the MuJoCo-classic EVALUATION stack (evaluation/rollout.py),
  # which deliberately integrates finer than training. Holosoma trains at
  # sim fps 200 / control_decimation 4 (SimEngineConfig) — a different substep
  # but the SAME 50 Hz policy rate, which is what the policy interface fixes.
  # Do not "sync" these values to the trainer; change policy_frequency_hz only.
  sim_timestep_s: 0.001                  # official MJCF <option timestep>
  decimation: 20                         # assumed (=1000/50)
  action: joint_position_offset          # assumed (PD position targets, upstream-standard)
  action_scale: 0.25                     # assumed, tune during port

# ---------------------------------------------------------------------
# Get-up task conventions (project, not hardware). Rationale in
# docs/research/getup_recipes.md and the approved get-up plan.
# ---------------------------------------------------------------------
getup:
  control_joints_mode: legs_waist_arms     # same 29-DOF set as locomotion
  # Wrists carry only 6 Nm on a 60 kg robot: never load-bearing. Soft-freeze
  # during ground phases via a tight action scale (policy still commands them,
  # but cannot slam them); revisit only if discovered strategies need palms.
  wrist_action_scale: 0.05                 # vs action_scale 0.25 elsewhere
  # Head links are welded but their boxes protect prone/side poses; head has
  # no actuators to protect.
  # Terminal state = the locomotion policy's expected initial state, so the
  # handoff is a plain switch. Success requires holding this, not just
  # "torso vertical".
  terminal:
    target_pose: default_pose              # see default_pose below
    base_height_tol_m: 0.08
    joint_pos_tol_rad: 0.30                # mean over legs+waist
    base_lin_vel_max_m_s: 0.25
    joint_vel_max_rad_s: 1.0
    hold_time_s: 2.0
  # During get-up, pelvis/torso ground contact is EXPECTED — the locomotion
  # termination_contact_bodies convention does not apply. No illegal-contact
  # termination; hardware-abuse is handled by reward penalties instead.
  fallen_pose_bank: assets/a3_ultra/getup/  # scripts/getup/generate_fallen_poses.py
  lying_keyframes: [lying_supine, lying_prone, lying_side_left, lying_side_right]

# PD gains: ASSUMED starting values for simulation only (MJCF ships
# torque motors with no gains; no official PD spec published). Sized for
# a 60 kg humanoid using Isaac Lab H1/G1 configs as prior art. Tune.
pd_gains_assumed:
  # RL-style gains (policies balance actively). NOTE: pure PD pose-hold
  # standing is statically unstable with these — an inverted pendulum needs
  # ankle-pitch stiffness > m*g*h_com ~ 530 Nm/rad. Diagnostics that require
  # passive standing use a separate stiff "hold mode" (see
  # scripts/diagnostics/check_mujoco_model.py); do not train with hold gains.
  hip:            {kp: 200.0, kd: 5.0}
  knee:           {kp: 200.0, kd: 5.0}
  ankle:          {kp: 100.0, kd: 4.0}
  waist:          {kp: 300.0, kd: 6.0}
  shoulder:       {kp: 60.0,  kd: 2.0}
  elbow:          {kp: 60.0,  kd: 2.0}
  wrist:          {kp: 10.0,  kd: 0.5}
  head:           {kp: 10.0,  kd: 0.5}
  joint_pattern_map:   # regex -> group
    ".*hip.*": hip
    ".*knee.*": knee
    ".*ankle.*": ankle
    "waist.*": waist
    ".*shoulder.*": shoulder
    ".*elbow.*": elbow
    ".*wrist.*": wrist
    "head.*": head

# ---------------------------------------------------------------------
# Nominal standing pose: ASSUMED (slightly bent knees, arms relaxed).
# The official MJCF keyframe is NOT a clean stand (captured off-nominal
# pose) and is ignored. Validated by scripts/diagnostics/
# check_mujoco_model.py settle test. Unlisted joints default to 0.
# ---------------------------------------------------------------------
default_pose:
  # base_height_m: measured by FK: lowest contact geom at this crouch pose
  # touches ground with pelvis at 1.063 m (straight-leg value: 1.076 m).
  base_height_m: 1.063
  joint_pos:
    left_hip_pitch_joint: -0.2
    left_knee_joint: 0.4
    left_ankle_pitch_joint: -0.2
    right_hip_pitch_joint: -0.2
    right_knee_joint: 0.4
    right_ankle_pitch_joint: -0.2
    left_shoulder_roll_joint: 0.15
    right_shoulder_roll_joint: -0.15
    left_elbow_joint: 0.3
    right_elbow_joint: 0.3

# ---------------------------------------------------------------------
# Bodies / contacts / sensors (official)
# ---------------------------------------------------------------------
bodies:
  base: pelvis_link
  torso: torso_Link
  feet: [left_ankle_roll_Link, right_ankle_roll_Link]
  knees: [left_knee_Link, right_knee_Link]
  termination_contact_bodies: [pelvis_link, torso_Link]   # project convention
  foot_sites: [left_foot, right_foot]      # site pos (0.04, 0, -0.067) in ankle_roll frame
  foot_contact_geoms_per_foot: 13          # tiny spheres (r=0.002) outlining each sole
  foot_length_m: 0.269                     # official geom span (x: -0.084..+0.185)
  foot_width_m: 0.102                      # official geom span (y: ±0.051)

sensors:
  imu_sites: [imu_in_pelvis, imu_in_torso]  # official; pelvis IMU is primary
  mjcf_provides: [jointpos, jointvel, jointactfrc, gyro, accelerometer, velocimeter, framepos, framequat, subtreeangmom]

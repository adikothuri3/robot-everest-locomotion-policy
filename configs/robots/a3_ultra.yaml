# =====================================================================
# Canonical robot manifest: AgiBot A3 Ultra (T2.5 torso variant)
# =====================================================================
# SOURCE OF TRUTH for joint ordering, limits, and naming across ALL
# simulators (MuJoCo, Isaac Lab, MJWarp/Holosoma). Any adapter MUST map
# its internal ordering to/from `joint_order` below. Tests enforce this.
#
# Provenance:
#   official : extracted programmatically from the official model repo
#              https://github.com/AgibotTech/A3-A3U-robot-model
#              commit 589f508ff357447c610a3f3004419035ddc8f153 (2026-08-06)
#              files: a3_ultra_t2d5/mjcf/a3_ultra_t2d5.xml, urdf/model.urdf
#              license: Mulan PSL v2 (permissive)
#   assumed  : temporary simulation assumption chosen by this project;
#              NOT a hardware spec. Every assumed value is marked.
#
# Variant note: a3_ultra_t3d0 adds dexterous hands (+32 finger DOF, 65
# bodies) and renames head_pitch_joint -> ultra_head_pitch_joint; its MJCF
# is not standalone (broken terrain include). DECISION 2026-08-15: this
# project trains on T2.5 (confirmed with team; see notes/decisions.md).
# T3.0 COMPATIBILITY GUARANTEE: the 29 trained joints are name-identical
# across variants (head is frozen in both), so policies trained here deploy
# on a T3.0 robot unchanged via name-mapped joints, with the hand controller
# owning the fingers. The base A3 (a3_t2d5/a3_t3d0) shares limb topology;
# not yet manifested.

robot:
  name: a3_ultra
  variant: a3_ultra_t2d5
  source_repo: https://github.com/AgibotTech/A3-A3U-robot-model
  source_commit: 589f508ff357447c610a3f3004419035ddc8f153
  license: MulanPSL-2.0
  mjcf: third_party/A3-A3U-robot-model/a3_ultra_t2d5/mjcf/a3_ultra_t2d5.xml
  urdf: third_party/A3-A3U-robot-model/a3_ultra_t2d5/urdf/model.urdf
  total_mass_kg: 60.1776          # official (MJCF, computed by MuJoCo)
  base_link: pelvis_link          # official (free joint root)
  num_actuated_joints: 31         # official
  num_bodies: 32                  # official (excl. world)

# ---------------------------------------------------------------------
# CANONICAL JOINT ORDER (official MJCF <actuator> order: legs L,R ->
# waist -> arms L,R -> head). NOTE: the MJCF kinematic-tree joint order
# differs (waist subtree first); never use tree order for obs/actions.
# limits_rad: official. effort_nm: official (URDF effort == MJCF
# actuatorfrcrange). vel_rad_s: official (URDF). damping / frictionloss:
# official MJCF passive values.
# ---------------------------------------------------------------------
joint_order:
  - left_hip_pitch_joint
  - left_hip_roll_joint
  - left_hip_yaw_joint
  - left_knee_joint
  - left_ankle_pitch_joint
  - left_ankle_roll_joint
  - right_hip_pitch_joint
  - right_hip_roll_joint
  - right_hip_yaw_joint
  - right_knee_joint
  - right_ankle_pitch_joint
  - right_ankle_roll_joint
  - waist_yaw_joint
  - waist_roll_joint
  - waist_pitch_joint
  - left_shoulder_pitch_joint
  - left_shoulder_roll_joint
  - left_shoulder_yaw_joint
  - left_elbow_joint
  - left_wrist_roll_joint
  - left_wrist_pitch_joint
  - left_wrist_yaw_joint
  - right_shoulder_pitch_joint
  - right_shoulder_roll_joint
  - right_shoulder_yaw_joint
  - right_elbow_joint
  - right_wrist_roll_joint
  - right_wrist_pitch_joint
  - right_wrist_yaw_joint
  - head_yaw_joint
  - head_pitch_joint


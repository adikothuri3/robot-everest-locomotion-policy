    lam: 0.95
    load_optimizer: true
    max_actor_learning_rate: null
    max_critic_learning_rate: null
    max_grad_norm: 1.0
    min_actor_learning_rate: null
    min_critic_learning_rate: null
    module_dict:
      actor:
        input_dim:
        - actor_obs
        layer_config:
          activation: ELU
          dropout_prob: 0.0
          encoder_activation: ELU
          encoder_hidden_dims: null
          encoder_input_name: ''
          encoder_output_dim: null
          hidden_channels: null
          hidden_dims:
          - 512
          - 256
          - 128
          input_channels: 1
          input_height: 1
          input_width: 1
          kernel_size: 3
          module_input_name: []
          padding: same
          stride: 1
          use_layer_norm: false
        min_mean_noise_std: null
        min_noise_std: null
        output_dim:
        - robot_action_dim
        type: MLP
      critic:
        input_dim:
        - critic_obs
        layer_config:
          activation: ELU
          dropout_prob: 0.0
          encoder_activation: ELU
          encoder_hidden_dims: null
          encoder_input_name: ''
          encoder_output_dim: null
          hidden_channels: null
          hidden_dims:
          - 512
          - 256
          - 128
          input_channels: 1
          input_height: 1
          input_width: 1
          kernel_size: 3
          module_input_name: []
          padding: same
          stride: 1
          use_layer_norm: false
        min_mean_noise_std: null
        min_noise_std: null
        output_dim:
        - 1
        type: MLP
    num_learning_epochs: 8
    num_learning_iterations: 20000
    num_mini_batches: 4
    num_steps_per_env: 24
    save_interval: 2000
    schedule: adaptive
    symmetry_actor_coef: 1.0
    symmetry_critic_coef: 0.0

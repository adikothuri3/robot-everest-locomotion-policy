algo:
  _recursive_: false
  _target_: holosoma.agents.fast_sac.fast_sac_agent.FastSACAgent
  config:
    actor_hidden_dim: 512
    actor_learning_rate: 0.0003
    actor_obs_keys:
    - actor_obs
    alpha_init: 0.001

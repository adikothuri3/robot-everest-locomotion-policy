    amp: true
    amp_dtype: bf16
    batch_size: 8192
    buffer_size: 1024
    compile: true
    critic_hidden_dim: 768
    critic_learning_rate: 0.0003
    critic_obs_keys:
    - critic_obs
    encoder_obs_key: perception_obs
    encoder_obs_shape:
    - 1
    - 13
    - 9
    eval_callbacks: null
    gamma: 0.97
    learning_starts: 10
    log_std_max: 0.0
    log_std_min: -5.0
    logging_interval: 100
    max_grad_norm: 0.0
    num_atoms: 101
    num_learning_iterations: 50000
    num_q_networks: 2
    num_steps: 1
    num_updates: 8
    obs_normalization: true
    policy_frequency: 4
    save_interval: 5000
    target_entropy_ratio: 0.0
    tau: 0.125
    use_autotune: true
    use_cnn_encoder: false
    use_layer_norm: true
    use_symmetry: true
    use_tanh: true
    v_max: 20.0
    v_min: -20.0
    weight_decay: 0.001
command:
